bundle:
  name: mlops-quickstart

include:
  - resources/mlops_pipeline_job.yml

run_as:
  service_principal_name: '1b082099-9f67-4728-ae71-1129bb5223c6'

targets:
  dev:
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    default: true
    variables:
      catalog_name: blc_development
      schema_name: iris
      environment: dev

  prod:
    mode: production
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: mlops_quickstart_prod
      schema_name: iris
      environment: prod

variables:
  catalog_name:
    description: "Name of the Unity Catalog to use"
    default: "blc_development"
  schema_name:
    description: "Name of the schema to use within the catalog"
    default: "iris"
  environment:
    description: "Environment name (dev/prod)"
    default: "dev"
